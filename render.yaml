services:
  - type: web
    name: dadtvplay-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python train_classifier.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: YAPE_NUMBER
        sync: false
      - key: YAPE_NAME
        sync: false
      - key: WAMUNDO_SECRET
        sync: false
      - key: WAMUNDO_ACCOUNT_ID
        sync: false
      - key: WAMUNDO_HOOK_TOKEN
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "30"
